anchor_link_ckeditor5_anchor:
  ckeditor5:
    plugins:
      - anchorDrupal.Anchor
      # The anchor UI integrates with the link balloon, so the link editing
      # plugins load with it even when the Link button is not in the toolbar.
      - link.LinkEditing
      - link.LinkUI
    config:
      htmlSupport:
        # Where this plugin is enabled, the anchor attributes belong to it, so
        # General HTML Support leaves them alone.
        disallow:
          - name: a
            attributes:
              - id
              - name
  drupal:
    label: Anchor link
    library: anchor_link/cke5_anchor_link
    admin_library: anchor_link/admin.cke5_anchor_link
    toolbar_items:
      anchor:
        label: Anchor link
    elements:
      - <a>
      - <a id="">
      - <a name="">
