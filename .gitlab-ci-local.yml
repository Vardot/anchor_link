# Pipeline for `gitlab-ci-local` (https://github.com/firecow/gitlab-ci-local).
#
# The real .gitlab-ci.yml `include:`s the drupalci templates and runs the
# varbase-e2e browser job inside the drupalci PHP-Apache image with a MySQL
# service - none of which gitlab-ci-local can reproduce ($_GITLAB_TEMPLATES_REPO
# is not a public path). This file reproduces the same work in a self-contained
# way so the whole thing can be exercised locally before pushing:
#
#   validate : cspell + eslint/yaml linters (Node 20)
#   test     : two varbase-e2e BDD suites against freshly built sites (MariaDB
#              service + `drush runserver`, the module added via a Composer path
#              repository):
#                - varbase-e2e-drupal-core-test → Drupal Core + Anchor Test recipe
#                - varbase-e2e-drupal-cms-test  → Drupal CMS + content_format
#
# Usage:
#   gitlab-ci-local --file .gitlab-ci-local.yml                              # all jobs
#   gitlab-ci-local --file .gitlab-ci-local.yml varbase-e2e-drupal-core-test  # Core suite
#   gitlab-ci-local --file .gitlab-ci-local.yml varbase-e2e-drupal-cms-test   # CMS suite
#   gitlab-ci-local --file .gitlab-ci-local.yml cspell                       # one linter

stages:
  - validate
  - test

variables:
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
  COMPOSER_MEMORY_LIMIT: "-1"
  COMPOSER_ALLOW_SUPERUSER: "1"

cspell:
  stage: validate
  image: node:20
  before_script:
    - npm install -g cspell@8
  script:
    - cspell "**/*.{php,module,inc,install,yml,md}" --no-progress
  allow_failure: false

eslint:
  stage: validate
  image: node:20
  before_script:
    - corepack enable
    - yarn install
  script:
    - node --version
    # The maintained module JS (js/**) is vendored CKEditor 4 plugin code and is
    # ignored via .eslintrc.json; this confirms the config loads and there is no
    # stray broken first-party JS.
    - node ./node_modules/eslint/bin/eslint.js --no-error-on-unmatched-pattern --ext .js .
    - yarn lint:yaml
  allow_failure: false

# Self-contained varbase-e2e browser job (Drupal Core / Standard profile). One
# container holds PHP (to build and serve the site over MariaDB via
# `drush runserver`) and Node (to run the Playwright + Cucumber suite). The
# module under test is pulled into the site through a Composer path repository
# pointing at the checked-out repo, so the exact working-tree code is what gets
# exercised. The Anchor Test CKEditor 5 format is provisioned by applying the
# tests/recipes/anchor_link_test recipe.
varbase-e2e-drupal-core-test:
  stage: test
  image: node:20-bookworm
  # MariaDB service (Drupal 11 needs SQLite >= 3.45, newer than Debian ships,
  # so use a DB server - the same way the real drupalci pipeline does).
  services:
    - name: mariadb:10.11
      alias: database
  variables:
    MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
    MARIADB_DATABASE: "drupal"
    LAUNCH_URL: "http://127.0.0.1:8888"
    BROWSER: "chromium"
    VARBASE_E2E_REPORT_DISABLE: "1"
    SITE: "/app"
    DB_URL: "mysql://root@database:3306/drupal"
    PHP_CLI_SERVER_WORKERS: "8"
  before_script:
    # --- PHP 8.3 (Sury repo - bookworm ships 8.2, Drupal 11 needs >=8.3) ----
    - apt-get update -qq
    - apt-get install -y -qq lsb-release ca-certificates curl unzip git apt-transport-https >/dev/null
    - curl -sSL https://packages.sury.org/php/apt.gpg -o /etc/apt/trusted.gpg.d/sury-php.gpg
    - echo "deb https://packages.sury.org/php/ $(lsb_release -sc) main" > /etc/apt/sources.list.d/sury-php.list
    - apt-get update -qq
    - apt-get install -y -qq php8.3-cli php8.3-mysql php8.3-gd php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip default-mysql-client >/dev/null
    - php -v | head -n1
    # Wait for the MariaDB service to accept connections.
    - for i in $(seq 1 60); do mysqladmin --host=database --user=root ping >/dev/null 2>&1 && break; sleep 2; done
    - mysqladmin --host=database --user=root ping
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    # --- Node test-runner deps (varbase-e2e + cucumber + playwright) --------
    - cd "$CI_PROJECT_DIR"
    - corepack enable && yarn install
    - ./node_modules/.bin/playwright install --with-deps chromium
    # --- Build a Drupal 11 site with the module via a path repository ------
    - composer create-project drupal/recommended-project "$SITE" --no-interaction --no-install
    - cd "$SITE"
    - composer config minimum-stability dev
    - composer config prefer-stable true
    - composer config --no-plugins allow-plugins.composer/installers true
    - composer config --no-plugins allow-plugins.drupal/core-composer-scaffold true
    - composer config --no-plugins allow-plugins.drupal/core-project-message true
    - composer config repositories.anchor_link path "$CI_PROJECT_DIR"
    - composer require "drupal/anchor_link:*" drupal/linkit drush/drush --no-interaction
    # --- Install + enable + apply the Anchor Test recipe -------------------
    - vendor/bin/drush site:install standard --db-url="$DB_URL" --account-name=webmaster --account-pass=dD.123123ddd --site-name="CKEditor Anchor Link Test" -y
    - vendor/bin/drush en -y ckeditor5 editor filter anchor_link
    - vendor/bin/drush recipe "$CI_PROJECT_DIR/tests/recipes/anchor_link_test" -y
    - vendor/bin/drush cr
    # --- Serve the site in the background ----------------------------------
    - chmod -R 777 web/sites/default/files
    - vendor/bin/drush runserver 127.0.0.1:8888 >/tmp/runserver.log 2>&1 &
    - for i in $(seq 1 30); do curl -fsS -o /dev/null "$LAUNCH_URL/user/login" && break; sleep 1; done
    - curl -fsS -o /dev/null "$LAUNCH_URL/user/login" && echo "site is up"
  script:
    - cd "$CI_PROJECT_DIR"
    - ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
    - node ./node_modules/@vardot/varbase-e2e/bin/generate-reports.js --json tests/reports/cucumber_report.json --out tests/reports/cucumber_report.html || true
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
  allow_failure: false

# Self-contained varbase-e2e browser job (Drupal CMS distribution). Builds a
# fresh `drupal/cms` project, adds the module via a Composer path repository,
# installs with the `drupal_cms_installer` profile, renames uid 1 to webmaster,
# adds the Anchor button to Drupal CMS's `content_format` (its content field is
# locked to that format), and runs the Drupal-CMS feature set.
varbase-e2e-drupal-cms-test:
  stage: test
  image: node:20-bookworm
  services:
    - name: mariadb:10.11
      alias: database
  variables:
    MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
    MARIADB_DATABASE: "drupal"
    LAUNCH_URL: "http://127.0.0.1:8888"
    BROWSER: "chromium"
    VARBASE_E2E_REPORT_DISABLE: "1"
    SITE: "/app-cms"
    DB_URL: "mysql://root@database:3306/drupal"
    PHP_CLI_SERVER_WORKERS: "8"
  before_script:
    # --- PHP 8.3 (Sury repo) -----------------------------------------------
    - apt-get update -qq
    - apt-get install -y -qq lsb-release ca-certificates curl unzip git apt-transport-https >/dev/null
    - curl -sSL https://packages.sury.org/php/apt.gpg -o /etc/apt/trusted.gpg.d/sury-php.gpg
    - echo "deb https://packages.sury.org/php/ $(lsb_release -sc) main" > /etc/apt/sources.list.d/sury-php.list
    - apt-get update -qq
    - apt-get install -y -qq php8.3-cli php8.3-mysql php8.3-gd php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip default-mysql-client >/dev/null
    - php -v | head -n1
    - for i in $(seq 1 60); do mysqladmin --host=database --user=root ping >/dev/null 2>&1 && break; sleep 2; done
    - mysqladmin --host=database --user=root ping
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    # --- Node test-runner deps ---------------------------------------------
    - cd "$CI_PROJECT_DIR"
    - corepack enable && yarn install
    - ./node_modules/.bin/playwright install --with-deps chromium
    # --- Build a fresh Drupal CMS project with the module via a path repo ---
    # Composer 2.10 blocks installing advisory-flagged packages by default;
    # drupal/cms's locked guzzlehttp/psr7 2.8.x trips it, so disable the block.
    - composer config --global policy.advisories.block false
    - composer create-project drupal/cms "$SITE" --no-interaction --no-progress
    - cd "$SITE"
    - composer config minimum-stability dev
    - composer config prefer-stable true
    - composer config repositories.anchor_link '{"type":"path","url":"'"$CI_PROJECT_DIR"'","options":{"symlink":true}}'
    - composer require 'drupal/anchor_link:3.0.x-dev@dev' --no-interaction --no-progress
    # --- Install Drupal CMS, rename uid 1, enable + provision --------------
    - vendor/bin/drush --root="$SITE/web" site:install drupal_cms_installer --db-url="$DB_URL" --site-name="CKEditor Anchor Link CMS Test" -y
    - vendor/bin/drush --root="$SITE/web" php:eval '$u=\Drupal\user\Entity\User::load(1);$u->setUsername("webmaster")->setPassword("dD.123123ddd")->save();'
    - vendor/bin/drush --root="$SITE/web" en -y ckeditor5 editor filter anchor_link
    # Drupal CMS ships autosave_form, which keeps a background autosave
    # connection open on the node form (so it never settles) and offers a
    # "restore draft" prompt on re-open; the suite does not need it.
    - vendor/bin/drush --root="$SITE/web" pmu -y autosave_form || true
    # Add the Anchor button to Drupal CMS's content_format + allow id/name/class.
    - vendor/bin/drush --root="$SITE/web" php:eval '$f="content_format";$e=\Drupal::entityTypeManager()->getStorage("editor")->load($f);$s=$e->getSettings();if(!in_array("anchor",$s["toolbar"]["items"],TRUE)){$p=array_search("link",$s["toolbar"]["items"],TRUE);array_splice($s["toolbar"]["items"],$p===FALSE?0:$p+1,0,"anchor");$e->setSettings($s);$e->save();}$m=\Drupal::entityTypeManager()->getStorage("filter_format")->load($f);$c=$m->filters("filter_html")->getConfiguration();$c["settings"]["allowed_html"]=str_replace("<a ","<a id name class ",$c["settings"]["allowed_html"]);$m->setFilterConfig("filter_html",$c);$m->save();'
    # Disable CSS/JS aggregation: avoids the one-off aggregate-compile delay on
    # the first browser load of the heavy Gin + CKEditor 5 page form.
    - vendor/bin/drush --root="$SITE/web" cset system.performance css.preprocess 0 -y
    - vendor/bin/drush --root="$SITE/web" cset system.performance js.preprocess 0 -y
    - vendor/bin/drush --root="$SITE/web" cr
    # --- Serve the site in the background ----------------------------------
    - chmod -R 777 web/sites/default/files
    - vendor/bin/drush --root="$SITE/web" runserver 127.0.0.1:8888 >/tmp/runserver-cms.log 2>&1 &
    - for i in $(seq 1 30); do curl -fsS -o /dev/null "$LAUNCH_URL/user/login" && break; sleep 1; done
    - curl -fsS -o /dev/null "$LAUNCH_URL/user/login" && echo "Drupal CMS site is up"
    # Warm the admin + editor pages: the first authenticated load compiles the
    # Gin admin theme + CKEditor 5 assets, which on a single-worker runserver can
    # exceed the browser suite's per-step timeout. Pre-compile them here.
    - ULI=$(vendor/bin/drush --root="$SITE/web" user:login --uri="$LAUNCH_URL" 2>/dev/null | tail -n1)
    - curl -s -c /tmp/cms-cookies -b /tmp/cms-cookies -L "$ULI" -o /dev/null || true
    - for p in /admin/config/content/formats /admin/config/content/formats/manage/content_format /node/add/page; do curl -s -b /tmp/cms-cookies -L "$LAUNCH_URL$p" -o /dev/null || true; done
  script:
    - cd "$CI_PROJECT_DIR"
    - ./node_modules/.bin/cucumber-js --config cucumber.drupalcms.js --tags "not @wip"
    - node ./node_modules/@vardot/varbase-e2e/bin/generate-reports.js --json tests/reports/drupalcms/cucumber_report.json --out tests/reports/drupalcms/cucumber_report.html || true
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
  allow_failure: false
